# Build settings in the Netlify format, which several static hosts read.
# opus.ro is not on Netlify; this tells whichever builder picks the repo up
# how to build it. GitHub Pages ignores it and uses .github/workflows/deploy.yml.
#
# No SPA redirect here on purpose: the site is many real pages now, and a
# catch-all to index.html would break every one of them.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
